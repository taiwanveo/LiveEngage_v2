<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveEngage Screen 投影</title>
    <script>
      (function () {
        try {
          var k = "liveengage-theme";
          var t = localStorage.getItem(k);
          var ok = ["slido", "light", "dark", "cursor", "claude"];
          if (!t || ok.indexOf(t) < 0) t = "slido";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
